<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Hats | Bienvenido</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f3d266;
            --gold-dark: #9e7b1e;
            --bg-dark: #0a0a0a;
            --card-bg: rgba(18, 18, 18, 0.86);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            color: #f5f5f5;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: url("Imagenes page/fondito.jpg") center center / cover no-repeat;
            filter: blur(8px) brightness(0.42);
            transform: scale(1.08);
            z-index: -2;
            animation: slowZoomBg 18s ease-in-out infinite alternate;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(212, 175, 55, 0.08) 0%, rgba(0, 0, 0, 0.85) 100%);
            z-index: -1;
        }

        @keyframes slowZoomBg {
            from {
                transform: scale(1.06);
            }

            to {
                transform: scale(1.14);
            }
        }

        .ambient-particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--gold-light);
            border-radius: 50%;
            opacity: 0;
            box-shadow: 0 0 10px var(--gold);
            animation: floatParticle 7s infinite ease-in-out;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(105vh) scale(0.5);
                opacity: 0;
            }

            30% {
                opacity: 0.7;
            }

            80% {
                opacity: 0.5;
            }

            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }

        .captcha-container {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.55s ease, transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .captcha-container.exit {
            opacity: 0;
            transform: scale(0.92) translateY(-20px);
            pointer-events: none;
        }

        .captcha-card {
            background: var(--card-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(212, 175, 55, 0.42);
            padding: 36px 32px;
            border-radius: 24px;
            box-shadow: 0 25px 65px rgba(0, 0, 0, 0.85), 0 0 35px rgba(212, 175, 55, 0.14);
            text-align: center;
            width: 100%;
            max-width: 420px;
            animation: cardEntrance 0.75s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards;
            position: relative;
            overflow: hidden;
        }

        .captcha-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
            animation: topBorderGlow 3.5s infinite linear;
        }

        @keyframes topBorderGlow {
            0% {
                left: -60%;
            }

            100% {
                left: 120%;
            }
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.94);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .captcha-card.shake {
            animation: cardShake 0.42s ease;
            border-color: rgba(231, 76, 60, 0.75);
        }

        @keyframes cardShake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-10px);
            }

            40% {
                transform: translateX(10px);
            }

            60% {
                transform: translateX(-7px);
            }

            80% {
                transform: translateX(7px);
            }
        }

        .brand-logo-wrap {
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
        }

        .brand-logo-wrap img {
            height: 52px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.35));
        }

        .security-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: var(--gold-light);
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid rgba(212, 175, 55, 0.35);
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        .captcha-card h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: 0.8px;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .captcha-card p {
            font-size: 0.86rem;
            color: #aaa;
            margin-bottom: 20px;
        }

        /* Caja del Código Captcha responsiva */
        .verify-box-captcha {
            background: rgba(10, 10, 10, 0.85);
            padding: 10px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 14px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            width: 100%;
        }

        .captcha-display {
            font-family: 'Outfit', monospace;
            font-weight: 800;
            font-size: 24px;
            letter-spacing: 4px;
            background: radial-gradient(circle at center, #241d11 0%, #0d0b08 100%);
            color: var(--gold-light);
            padding: 10px 8px;
            border-radius: 10px;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.65);
            user-select: none;
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            border: 1px solid rgba(212, 175, 55, 0.35);
            position: relative;
            overflow: hidden;
        }

        .captcha-display::before {
            content: "";
            position: absolute;
            top: 32%;
            left: -10%;
            width: 120%;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, rgba(243, 210, 102, 0.45), transparent);
            transform: rotate(7deg);
            pointer-events: none;
        }

        .captcha-display::after {
            content: "";
            position: absolute;
            bottom: 28%;
            left: -10%;
            width: 120%;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, rgba(243, 210, 102, 0.4), transparent);
            transform: rotate(-9deg);
            pointer-events: none;
        }

        .captcha-char {
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .btn-captcha-refresh {
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: var(--gold-light);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            cursor: pointer;
            padding: 11px 11px;
            border-radius: 10px;
            transition: all 0.25s ease;
            flex-shrink: 0;
        }

        .btn-captcha-refresh:hover {
            background: var(--gold);
            color: #111;
        }

        .captcha-input-container {
            width: 100%;
            margin-bottom: 16px;
        }

        #captchaInput {
            width: 100%;
            padding: 12px 14px;
            background: #1b1b1b;
            border: 1px solid #363636;
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 5px;
            text-align: center;
            text-transform: uppercase;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        #captchaInput::placeholder {
            font-family: 'Poppins', sans-serif;
            font-size: 12.5px;
            font-weight: 400;
            letter-spacing: 0.4px;
            color: #777;
            text-transform: none;
        }

        #captchaInput:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.18);
        }

        #entrar {
            background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
            color: #111111;
            border: none;
            padding: 13px 28px;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #entrar:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(212, 175, 55, 0.5);
        }

        .hint-enter {
            display: block;
            font-size: 11px;
            color: #777;
            margin-top: 9px;
        }

        #mensaje {
            margin-top: 10px;
            font-size: 12.5px;
            font-weight: 600;
            min-height: 18px;
        }

        /* Ajustes específicos para celulares pequeños */
        @media (max-width: 440px) {
            .captcha-card {
                padding: 26px 18px;
                border-radius: 20px;
            }

            .brand-logo-wrap img {
                height: 44px;
            }

            .captcha-card h1 {
                font-size: 1.45rem;
            }

            .captcha-card p {
                font-size: 0.82rem;
                margin-bottom: 16px;
            }

            .captcha-display {
                font-size: 20px;
                letter-spacing: 2px;
                gap: 4px;
                padding: 9px 6px;
            }

            .btn-captcha-refresh {
                padding: 10px 9px;
                font-size: 10px;
            }

            #captchaInput {
                padding: 11px 10px;
                font-size: 15px;
                letter-spacing: 4px;
            }
        }

        /* Pantalla de Bienvenida */
        .welcome-screen {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            opacity: 0;
            pointer-events: none;
            transform: scale(1.06);
            transition: opacity 0.65s ease, transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .welcome-screen.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        .welcome-logo {
            height: 75px;
            width: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.55));
            animation: pulseLogo 2s infinite alternate;
        }

        @keyframes pulseLogo {
            from {
                transform: scale(0.98);
                filter: drop-shadow(0 0 18px rgba(212, 175, 55, 0.4));
            }

            to {
                transform: scale(1.04);
                filter: drop-shadow(0 0 32px rgba(243, 210, 102, 0.75));
            }
        }

        .welcome-kicker {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold-light);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .welcome-title {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.7rem, 5vw, 3.2rem);
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
            text-shadow: 0 4px 25px rgba(0, 0, 0, 0.8);
        }

        .welcome-subtitle {
            font-size: 0.92rem;
            color: #ccc;
            max-width: 440px;
            margin-bottom: 26px;
            line-height: 1.5;
        }

        .welcome-loader-bar {
            width: 240px;
            max-width: 80vw;
            height: 4px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            overflow: hidden;
        }

        .welcome-loader-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold-light));
            border-radius: 4px;
            transition: width 1.75s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .welcome-screen.active .welcome-loader-fill {
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="ambient-particles" id="particlesContainer"></div>

    <div class="captcha-container" id="captchaSection">
        <form class="captcha-card" id="captchaForm" autocomplete="off">
            <div class="brand-logo-wrap">
                <img src="Imagenes page/Header1.png" alt="Diamond Hats">
            </div>

            <span class="security-badge">Verificación de Seguridad</span>
            <h1>Diamond Hats</h1>
            <p>Ingresa el código de seguridad para acceder a la tienda</p>

            <div class="verify-box-captcha">
                <div class="captcha-display" id="captchaBox"></div>
                <button type="button" class="btn-captcha-refresh" id="refreshCaptcha"
                    title="Generar otro código">Nuevo</button>
            </div>

            <div class="captcha-input-container">
                <input type="text" id="captchaInput" placeholder="Escribe los 5 caracteres" maxlength="5" autofocus
                    required>
            </div>

            <button type="submit" id="entrar">Verificar y Entrar</button>
            <span class="hint-enter">Presiona Enter para continuar</span>
            <p id="mensaje"></p>
        </form>
    </div>

    <div class="welcome-screen" id="welcomeScreen">
        <img src="Imagenes page/Header1.png" alt="Diamond Hats" class="welcome-logo">
        <div class="welcome-kicker">Acceso Concedido</div>
        <h2 class="welcome-title">Bienvenido a Diamond Hats</h2>
        <p class="welcome-subtitle">Estilo con actitud y distinción. Preparando nuestra colección exclusiva para ti...
        </p>
        <div class="welcome-loader-bar">
            <div class="welcome-loader-fill"></div>
        </div>
    </div>

    <script>
        const particlesContainer = document.getElementById("particlesContainer");
        for (let i = 0; i < 16; i++) {
            const p = document.createElement("span");
            p.className = "particle";
            p.style.left = Math.random() * 100 + "vw";
            p.style.animationDelay = (Math.random() * 7) + "s";
            p.style.animationDuration = (5 + Math.random() * 5) + "s";
            particlesContainer.appendChild(p);
        }

        const captchaForm = document.getElementById("captchaForm");
        const captchaBox = document.getElementById("captchaBox");
        const refreshCaptchaBtn = document.getElementById("refreshCaptcha");
        const captchaInput = document.getElementById("captchaInput");
        const mensajeText = document.getElementById("mensaje");
        const captchaSection = document.getElementById("captchaSection");
        const welcomeScreen = document.getElementById("welcomeScreen");

        let currentCaptcha = "";
        let verificado = false;

        function generarCaptcha() {
            const caracteres = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            let resultado = "";
            captchaBox.innerHTML = "";

            for (let i = 0; i < 5; i++) {
                const char = caracteres.charAt(Math.floor(Math.random() * caracteres.length));
                resultado += char;

                const span = document.createElement("span");
                span.className = "captcha-char";
                span.textContent = char;
                const rot = Math.floor(Math.random() * 14) - 7;
                span.style.transform = `rotate(${rot}deg)`;
                captchaBox.appendChild(span);
            }

            currentCaptcha = resultado;
            captchaInput.value = "";
            captchaInput.focus();
        }

        generarCaptcha();

        refreshCaptchaBtn.addEventListener("click", () => {
            mensajeText.textContent = "";
            generarCaptcha();
        });

        function validarAcceso(e) {
            if (e) e.preventDefault();
            if (verificado) return;

            const inputVal = captchaInput.value.trim().toUpperCase();

            if (inputVal === currentCaptcha) {
                verificado = true;
                mensajeText.style.color = "#2ecc71";
                mensajeText.textContent = "Verificación exitosa";

                setTimeout(() => {
                    captchaSection.classList.add("exit");
                    setTimeout(() => {
                        welcomeScreen.classList.add("active");
                    }, 220);

                    setTimeout(() => {
                        window.location.href = "tienda.html";
                    }, 2100);
                }, 300);
            } else {
                mensajeText.style.color = "#ff6b6b";
                mensajeText.textContent = "Código incorrecto. Inténtalo de nuevo.";

                captchaForm.classList.remove("shake");
                void captchaForm.offsetWidth;
                captchaForm.classList.add("shake");

                generarCaptcha();
            }
        }

        captchaForm.addEventListener("submit", validarAcceso);
        captchaInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                validarAcceso();
            }
        });
    </script>
</body>

</html>
